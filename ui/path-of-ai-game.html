<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATH of AI — Game HUD</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Cinzel:wght@400;600;700;800;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ═══════════════════════════════════════════════
         PoE-EXACT COLORS (from horadric-helper + game data)
         Source: github.com/meta-is-beta/horadric-helper
         ═══════════════════════════════════════════════ */

      /* UI Backgrounds (dark, near-black, slightly warm) */
      --bg-dark: #0c0b0a;
      --bg-panel: #171411;
      --bg-card: #1e1b16;
      --bg-hover: #282420;
      --bg-tooltip: #111;

      /* Borders */
      --border: #3c3630;
      --border-blood: #5a1a1a;
      --border-gold: #8c7a30;
      --border-highlight: #c4a830;

      /* Text (high contrast) */
      --text: #d4cfc4;
      --text-bright: #f0ece4;
      --text-value: #fff;        /* PoE shows stat numbers in pure white */
      --text-muted: #7f7f7f;     /* PoE exact default grey */
      --text-dim: #4a4540;

      /* Blood accents */
      --blood: #8b1a1a;
      --blood-bright: #c42b2b;

      /* Gold accents */
      --gold: #c4a830;
      --gold-glow: #c4a83040;

      /* Damage types (PoE exact from horadric-helper) */
      --fire: #960000;           /* dark blood red */
      --fire-bright: #960000;    /* brighter for text on dark bg */
      --cold: #366492;           /* steel blue */
      --lightning: gold;         /* CSS gold = #ffd700 */
      --chaos: #d02090;          /* magenta-pink, NOT purple */
      --physical: #c4a882;

      /* Status */
      --life: #d20000;
      --es: #366492;
      --mana: #2060a0;
      --success: #4ae63a;        /* PoE quest green */
      --warning: gold;
      --danger: #d20000;         /* PoE corrupted red */
      --info: #88f;              /* PoE magic blue */

      /* Rarity (PoE exact) */
      --normal: #c8c8c8;
      --magic: #88f;
      --rare: #ff7;
      --unique: #af6025;
      --unique-bright: #e8a444;
      --gem-color: #1ba29b;
      --currency-color: var(--currency-color);
      --corrupted: #d20000;
      --crafted: #b8daf2;        /* light blue for crafted mods */
      --fractured: #a29162;
      --augmented: #88f;         /* blue for modified stats */

      /* Tier colors */
      --tier1: #e8d44d;
      --tier2: #4ae63a;          /* quest green */
      --tier3: #366492;          /* cold blue */
      --tier4: #7f7f7f;          /* PoE default grey */
      --tier5: #d20000;          /* corrupted red */

      /* Passive tree */
      --passive-title: #eee492;

      /* Crafting tag colors */
      --craft-fire: #ff9a77;
      --craft-cold: #93d8ff;
      --craft-lightning: #f8cb76;
      --craft-chaos: #d8a7d3;
      --craft-life: #c96e6e;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes glowText { 0%,100% { text-shadow: 0 0 4px #c42b2b40; } 50% { text-shadow: 0 0 12px #c42b2b80; } }
    @keyframes syncPulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes flameTitleGlow {
      0%,100% { text-shadow: 0 0 8px #c42b2b50, 0 0 20px #c42b2b30, 0 -2px 4px #ff660020; }
      25% { text-shadow: 0 0 12px #c42b2b70, 0 0 30px #c42b2b40, 0 -3px 8px #ff660040; }
      50% { text-shadow: 0 0 16px #c42b2b90, 0 0 40px #c42b2b50, 0 -4px 12px #ff660060; }
      75% { text-shadow: 0 0 10px #c42b2b60, 0 0 25px #c42b2b35, 0 -2px 6px #ff660030; }
    }
    @keyframes gemPulse {
      0%,100% { box-shadow: 0 0 6px currentColor, inset 0 0 4px rgba(255,255,255,0.1); }
      50% { box-shadow: 0 0 14px currentColor, inset 0 0 8px rgba(255,255,255,0.2); }
    }
    @keyframes slotPulse {
      0%,100% { box-shadow: inset 0 0 6px rgba(139,105,20,0.1), 0 0 4px rgba(139,105,20,0.05); }
      50% { box-shadow: inset 0 0 10px rgba(139,105,20,0.2), 0 0 8px rgba(139,105,20,0.1); }
    }
    @keyframes buffFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes combatSlash {
      0% { transform: rotate(-30deg) scale(0); opacity:0; }
      30% { transform: rotate(10deg) scale(1.2); opacity:1; }
      100% { transform: rotate(30deg) scale(0.8); opacity:0; }
    }
    @keyframes dmgNumber {
      0% { transform: translateY(0) scale(0.5); opacity:0; }
      15% { transform: translateY(-10px) scale(1.2); opacity:1; }
      100% { transform: translateY(-50px) scale(0.8); opacity:0; }
    }
    @keyframes cardFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes subtlePulse { 0%,100% { opacity:1; } 50% { opacity:0.85; } }
    @keyframes countUp { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
    @keyframes vignetteBreath { 0%,100% { opacity:0.85; } 50% { opacity:0.95; } }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes orbPulse {
      0%,100% { box-shadow: 0 0 10px rgba(196,30,30,0.4), inset 0 0 15px rgba(196,30,30,0.2); }
      50% { box-shadow: 0 0 18px rgba(196,30,30,0.6), inset 0 0 20px rgba(196,30,30,0.3); }
    }
    @keyframes orbPulseMana {
      0%,100% { box-shadow: 0 0 8px rgba(48,96,192,0.4), inset 0 0 12px rgba(48,96,192,0.2); }
      50% { box-shadow: 0 0 14px rgba(48,96,192,0.6), inset 0 0 16px rgba(48,96,192,0.3); }
    }
    @keyframes gemBtnGlow {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }

    * { margin:0; padding:0; box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#3a3028 #0c0a08; }
    ::-webkit-scrollbar { width:5px; } ::-webkit-scrollbar-track { background:#0c0a08; } ::-webkit-scrollbar-thumb { background:#3a3028; border-radius:3px; }

    html, body { height:100%; overflow:hidden; }
    body {
      color: var(--text);
      font-family: 'Crimson Text', serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0.2px;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.5) 100%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(20,16,10,0.1) 2px, rgba(20,16,10,0.1) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(18,14,10,0.08) 3px, rgba(18,14,10,0.08) 5px),
        radial-gradient(ellipse at 20% 0%, #14100a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #0e0c08 0%, transparent 50%),
        var(--bg-dark);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content:''; position:fixed; top:0;left:0;right:0;bottom:0; pointer-events:none; z-index:9999;
      background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(2,1,3,0.5) 100%);
      animation:vignetteBreath 8s ease-in-out infinite;
    }

    .mono { font-family:'JetBrains Mono',monospace; }

    /* ========== HEADER BAR ========== */
    .hud-header {
      height:48px; min-height:48px;
      background: linear-gradient(180deg, #1a150e 0%, #14120e 40%, var(--bg-dark) 100%);
      border-bottom: 2px solid var(--border-blood);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; position:relative; z-index:10;
    }
    .hud-header::before {
      content:''; position:absolute; top:0;left:0;right:0; height:1px;
      background:linear-gradient(90deg, transparent 10%, var(--border-gold) 30%, var(--gold) 50%, var(--border-gold) 70%, transparent 90%);
    }
    .hud-header::after {
      content:''; position:absolute; bottom:0;left:0;right:0; height:2px;
      background:linear-gradient(90deg, transparent 5%, var(--blood-bright) 30%, var(--blood) 50%, var(--blood-bright) 70%, transparent 95%);
      box-shadow:0 0 12px rgba(196,43,43,0.4);
    }
    .hdr-title {
      font-family:'Cinzel',serif; font-size:20px; font-weight:900;
      color:var(--blood-bright); letter-spacing:3px;
      animation:flameTitleGlow 4s ease-in-out infinite;
    }
    .hdr-title span { color:var(--text-muted); font-size:12px; margin:0 4px; }
    .hdr-class {
      font-family:'Cinzel',serif; font-size:13px; font-weight:700;
      color:var(--text); text-shadow:0 1px 2px rgba(0,0,0,0.5);
    }
    .hdr-class .lvl { color:var(--text-dim); font-weight:400; font-size:11px; margin-left:6px; }
    .hdr-sync { display:flex; align-items:center; gap:6px; }
    .sync-dot {
      width:7px;height:7px;border-radius:50%;background:var(--success);
      box-shadow:0 0 8px #4ae63a80; animation:syncPulse 2s ease infinite;
    }
    .hdr-val { font-size:11px; color:var(--gold); font-family:'JetBrains Mono',monospace; text-shadow:0 0 6px rgba(212,164,56,0.3); }

    /* ========== MAIN 3-COLUMN LAYOUT ========== */
    .hud-body {
      flex:1; display:flex; overflow:hidden; min-height:0;
    }

    /* LEFT SIDEBAR */
    .sidebar-left {
      width:130px; min-width:130px;
      background: linear-gradient(180deg, #141210, #0c0a08);
      border-right:1px solid var(--border);
      padding:10px 8px;
      overflow-y:auto;
      display:flex; flex-direction:column; gap:6px;
    }
    .stat-row {
      text-align:center; padding:6px 4px; border-radius:2px;
      background: linear-gradient(180deg,#1a1712,#161410);
      border:1px solid var(--border);
      position:relative; overflow:hidden;
    }
    .stat-row::before {
      content:''; position:absolute; top:0;left:0;right:0; height:2px;
    }
    .stat-row.life-row::before { background:linear-gradient(90deg,transparent,var(--life),transparent); }
    .stat-row.es-row::before { background:linear-gradient(90deg,transparent,var(--es),transparent); }
    .stat-row.armour-row::before { background:linear-gradient(90deg,transparent,var(--physical),transparent); }
    .stat-row.dps-row::before { background:linear-gradient(90deg,transparent,var(--fire),transparent); }
    .stat-row .s-icon { font-size:14px; }
    .stat-row .s-val {
      font-size:18px; font-weight:700; font-family:'JetBrains Mono',monospace;
      line-height:1.1; text-shadow:0 0 8px currentColor;
      animation:subtlePulse 4s ease-in-out infinite, countUp 0.5s ease-out;
    }
    .stat-row .s-label { font-size:8px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }

    .resist-mini { padding:4px; border-radius:2px; display:flex; align-items:center; gap:5px; }
    .resist-mini .r-orb {
      width:24px;height:24px;border-radius:50%; display:flex;align-items:center;justify-content:center;
      font-size:11px; border:2px solid var(--border); position:relative; flex-shrink:0;
    }
    .resist-mini .r-orb::after {
      content:''; position:absolute; top:2px;left:4px; width:6px;height:4px;
      background:radial-gradient(ellipse,rgba(255,255,255,0.2) 0%,transparent 100%); border-radius:50%;
    }
    .resist-mini .r-orb.fire { background:radial-gradient(circle at 35% 30%,#6a2a0a,#3a1508,#1a0a04); border-color:var(--fire); box-shadow:0 0 6px rgba(207,58,31,0.3); }
    .resist-mini .r-orb.cold { background:radial-gradient(circle at 35% 30%,#1a3a6a,#0a1a3a,#040a1a); border-color:var(--cold); box-shadow:0 0 6px rgba(54,116,194,0.3); }
    .resist-mini .r-orb.lightning { background:radial-gradient(circle at 35% 30%,#5a4820,#3a3010,#1a1408); border-color:var(--lightning); box-shadow:0 0 6px rgba(232,198,37,0.3); }
    .resist-mini .r-orb.chaos { background:radial-gradient(circle at 35% 30%,#3a2050,#2a1a3a,#0a0410); border-color:var(--chaos); box-shadow:0 0 6px rgba(168,85,247,0.3); }
    .resist-mini .r-info { flex:1; text-align:left; }
    .resist-mini .r-val { font-size:12px; font-weight:700; font-family:'JetBrains Mono',monospace; }
    .resist-mini .r-val.capped { color:var(--success); }
    .resist-mini .r-val.uncapped { color:var(--danger); }
    .resist-mini .r-oc { font-size:8px; color:var(--text-dim); }

    /* CENTER PANEL */
    .center-panel {
      flex:1; overflow-y:auto; padding:12px;
      background: var(--bg-dark);
      display:flex; flex-direction:column; gap:12px;
    }

    /* Equipment grid */
    .equip-grid {
      display:grid; grid-template-columns:1fr 1fr 1fr;
      gap:5px; max-width:360px; margin:0 auto; width:100%;
    }
    .equip-slot {
      background:linear-gradient(180deg,#1c1810,#0c0a06);
      border:1px solid var(--border); border-radius:2px;
      padding:6px 4px; text-align:center; cursor:pointer;
      transition:all 0.15s; position:relative;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
      min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .equip-slot:hover { border-color:var(--border-gold); box-shadow:inset 0 1px 0 rgba(255,255,255,0.03),0 0 8px var(--gold-glow); }
    .equip-slot.active { border-color:var(--gold); box-shadow:0 0 12px var(--gold-glow); }
    .equip-slot .slot-icon { font-size:20px; }
    .equip-slot .slot-name { font-size:8px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .equip-slot .slot-score {
      position:absolute; top:1px; right:3px; font-size:9px; font-weight:800;
      font-family:'JetBrains Mono',monospace; text-shadow:0 0 4px currentColor;
    }

    /* CHARACTER EQUIPMENT SLOTS (positioned on body) */
    .char-slot {
      border:1px solid #8c7a3040;
      border-radius:3px;
      background:rgba(19,15,24,0.6);
      cursor:pointer;
      transition:all 0.2s;
      animation: slotPulse 3s ease-in-out infinite;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      backdrop-filter:blur(2px);
    }
    .char-slot:hover {
      border-color:var(--gold);
      background:rgba(139,105,20,0.15);
      box-shadow:0 0 12px var(--gold-glow), inset 0 0 8px rgba(139,105,20,0.1);
      transform:scale(1.08);
      z-index:5;
    }
    .char-slot.active {
      border-color:var(--gold);
      box-shadow:0 0 16px var(--gold-glow);
    }
    .char-slot-sm { border-radius:50%; }
    .char-slot .slot-label {
      position:absolute;
      bottom:-14px;
      left:50%;
      transform:translateX(-50%);
      font-size:7px;
      color:var(--text-dim);
      white-space:nowrap;
      font-family:'JetBrains Mono',monospace;
      text-transform:uppercase;
      letter-spacing:0.5px;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.2s;
    }
    .char-slot:hover .slot-label { opacity:1; }

    /* BUFF ICONS */
    .buff-icon {
      width:26px;
      height:26px;
      border-radius:3px;
      border:1px solid color-mix(in srgb, var(--buff-color) 50%, transparent);
      background:radial-gradient(circle at 40% 40%, color-mix(in srgb, var(--buff-color) 15%, #1c1914), #0c0a08);
      display:flex;
      align-items:center;
      justify-content:center;
      animation:buffFloat 3s ease-in-out infinite;
      box-shadow:0 0 6px color-mix(in srgb, var(--buff-color) 20%, transparent);
      cursor:default;
      position:relative;
    }
    .buff-icon:nth-child(2) { animation-delay:0.3s; }
    .buff-icon:nth-child(3) { animation-delay:0.6s; }
    .buff-icon:nth-child(4) { animation-delay:0.9s; }
    .buff-icon:nth-child(5) { animation-delay:1.2s; }
    .buff-icon:nth-child(6) { animation-delay:1.5s; }
    .buff-inner { font-size:13px; filter:brightness(1.2); }
    .buff-icon:hover {
      box-shadow:0 0 12px color-mix(in srgb, var(--buff-color) 40%, transparent);
      border-color:var(--buff-color);
    }
    .buff-icon:hover::after {
      content:attr(title);
      position:absolute;
      top:30px;
      left:50%;
      transform:translateX(-50%);
      font-size:9px;
      color:var(--text);
      background:var(--bg-card);
      border:1px solid var(--border);
      padding:2px 8px;
      border-radius:2px;
      white-space:nowrap;
      font-family:'JetBrains Mono',monospace;
      z-index:20;
      box-shadow:0 2px 8px rgba(0,0,0,0.5);
    }

    /* COMBAT DAMAGE NUMBERS */
    .dmg-num {
      position:absolute;
      font-family:'JetBrains Mono',monospace;
      font-weight:800;
      font-size:14px;
      pointer-events:none;
      animation:dmgNumber 1.2s ease-out forwards;
      text-shadow:0 1px 3px #000;
    }

    /* POWER-UP EFFECT — shown when upgrading item/skill */
    @keyframes powerUp {
      0% { transform:scale(1); filter:brightness(1); }
      15% { transform:scale(1.15); filter:brightness(1.8) saturate(1.5); }
      30% { transform:scale(1.05); filter:brightness(1.3); }
      100% { transform:scale(1); filter:brightness(1); }
    }
    @keyframes powerUpRing {
      0% { transform:translate(-50%,-50%) scale(0); opacity:0.8; }
      60% { opacity:0.3; }
      100% { transform:translate(-50%,-50%) scale(3); opacity:0; }
    }
    @keyframes powerUpText {
      0% { transform:translateY(0) scale(0.5); opacity:0; }
      20% { transform:translateY(-20px) scale(1.2); opacity:1; }
      60% { transform:translateY(-40px) scale(1); opacity:1; }
      100% { transform:translateY(-60px) scale(0.8); opacity:0; }
    }
    .char-powerup { animation: powerUp 0.8s ease-out; }
    .powerup-ring {
      position:absolute; top:50%; left:50%;
      width:60px; height:60px; border-radius:50%;
      border:2px solid var(--gold);
      pointer-events:none; z-index:20;
      animation: powerUpRing 0.8s ease-out forwards;
    }
    .powerup-text {
      position:absolute; top:40%; left:50%; transform:translateX(-50%);
      font-family:'Cinzel',serif; font-size:14px; font-weight:800;
      color:var(--gold); text-shadow:0 0 12px #c4a83080;
      pointer-events:none; z-index:20; white-space:nowrap;
      animation: powerUpText 1.5s ease-out forwards;
    }

    /* PASSIVE TREE MINI-VIEW */
    .passive-mini {
      position:relative;
      width:100%; height:120px;
      background:radial-gradient(circle at 50% 50%, #141210, #0c0a08);
      border:1px solid var(--border);
      border-radius:2px;
      overflow:hidden;
      cursor:pointer;
    }
    .passive-mini:hover { border-color:var(--border-gold); }
    .passive-mini-label {
      position:absolute; bottom:4px; right:6px;
      font-size:8px; color:var(--text-dim);
      font-family:'JetBrains Mono',monospace;
      text-transform:uppercase; letter-spacing:1px;
    }
    .passive-node {
      position:absolute;
      border-radius:50%;
      transition:all 0.15s;
    }
    .passive-node.allocated {
      background:var(--gold);
      box-shadow:0 0 4px var(--gold-glow);
    }
    .passive-node.unallocated {
      background:#3a3028;
      border:1px solid #3e333080;
    }
    .passive-node.keystone {
      border-radius:2px;
      border:1px solid var(--gold);
      background:#8c7a3040;
      box-shadow:0 0 6px var(--gold-glow);
    }
    .passive-link {
      position:absolute;
      background:var(--gold);
      opacity:0.3;
      transform-origin:left center;
    }

    .equip-slot .slot-label { font-size:7px; color:var(--text-dim); }
    .equip-slot-empty {
      background:linear-gradient(180deg,#141210,#0c0a08);
      border:1px dashed var(--border); border-radius:2px;
      min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    }

    /* Score rings row */
    .score-row { display:flex; justify-content:center; gap:20px; }
    .score-ring-sm { text-align:center; position:relative; }
    .score-ring-sm svg { transform:rotate(-90deg); filter:drop-shadow(0 0 6px var(--gold-glow)); }
    .score-ring-sm .sr-inner {
      position:absolute; top:50%;left:50%; transform:translate(-50%,-50%); text-align:center;
    }
    .score-ring-sm .sr-val {
      font-size:16px; font-weight:800; font-family:'JetBrains Mono',monospace; line-height:1;
      text-shadow:0 0 8px currentColor; animation:countUp 0.6s ease-out;
    }
    .score-ring-sm .sr-label { font-size:7px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }

    /* Harbinger warnings */
    .harbinger-compact {
      padding:6px 8px; margin-bottom:3px; border-radius:2px;
      display:flex; align-items:center; gap:6px;
      font-size:11px; animation:cardFadeIn 0.3s ease-out both;
    }
    .harbinger-compact.warning { background:linear-gradient(135deg,gold10,gold06); border:1px solid gold25; border-left:3px solid var(--warning); }
    .harbinger-compact .h-icon { font-size:12px; flex-shrink:0; }
    .harbinger-compact .h-text { color:var(--warning); font-weight:600; flex:1; }

    /* RIGHT PANEL */
    .sidebar-right {
      width:280px; min-width:280px;
      background: linear-gradient(180deg, #141210, #0c0a08);
      border-left:1px solid var(--border);
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    .rp-header {
      padding:8px 12px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      background:linear-gradient(180deg,#181614,#141210);
      min-height:36px;
    }
    .rp-title {
      font-family:'Cinzel',serif; font-size:11px; font-weight:700;
      color:var(--blood-bright); text-transform:uppercase; letter-spacing:1px;
      text-shadow:0 0 6px rgba(196,43,43,0.3);
    }
    .rp-close {
      width:22px;height:22px; border-radius:2px; border:1px solid var(--border);
      background:var(--bg-panel); color:var(--text-dim); cursor:pointer;
      display:flex;align-items:center;justify-content:center; font-size:12px;
      transition:all 0.15s;
    }
    .rp-close:hover { border-color:var(--blood-bright); color:var(--blood-bright); }
    .rp-content {
      flex:1; overflow-y:auto; padding:10px 12px;
    }

    /* ========== BOTTOM HUD BAR ========== */
    .hud-bar {
      height:56px; min-height:56px;
      background: linear-gradient(180deg, #120e16 0%, #0a080c 100%);
      border-top:2px solid var(--border-blood);
      display:flex; align-items:center;
      padding:0 12px; gap:12px;
      position:relative; z-index:10;
    }
    .hud-bar::before {
      content:''; position:absolute; top:0;left:0;right:0; height:1px;
      background:linear-gradient(90deg, transparent 5%, var(--blood-bright) 30%, var(--blood) 50%, var(--blood-bright) 70%, transparent 95%);
      box-shadow:0 -2px 8px rgba(196,43,43,0.2);
    }

    /* Life/Mana orbs */
    .orb-life {
      width:44px; height:44px; border-radius:50%;
      background: radial-gradient(circle at 40% 35%, #d20000, #8b1a1a 50%, #4a0e0e 85%, #2a0808);
      border:2px solid #5a1a1a;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0; position:relative;
      animation:orbPulse 3s ease-in-out infinite;
    }
    .orb-life .orb-val {
      font-size:11px; font-weight:800; color:#fff;
      font-family:'JetBrains Mono',monospace; text-shadow:0 1px 3px #000;
    }
    .orb-life::after {
      content:''; position:absolute; top:4px;left:8px; width:14px;height:8px;
      background:radial-gradient(ellipse,rgba(255,255,255,0.2) 0%,transparent 100%);
      border-radius:50%;
    }
    .orb-mana {
      width:36px; height:36px; border-radius:50%;
      background: radial-gradient(circle at 40% 35%, #366492, #1e4a8a 50%, #0e2a5a 85%, #081830);
      border:2px solid #1e3a6a;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0; position:relative;
      animation:orbPulseMana 3.5s ease-in-out infinite;
    }
    .orb-mana .orb-val {
      font-size:9px; font-weight:800; color:#fff;
      font-family:'JetBrains Mono',monospace; text-shadow:0 1px 3px #000;
    }
    .orb-mana::after {
      content:''; position:absolute; top:3px;left:6px; width:10px;height:6px;
      background:radial-gradient(ellipse,rgba(255,255,255,0.2) 0%,transparent 100%);
      border-radius:50%;
    }

    .hud-divider {
      width:1px; height:36px;
      background:linear-gradient(180deg,transparent,var(--border-blood),transparent);
      margin:0 4px;
    }

    /* Gem buttons */
    .gem-btns { display:flex; gap:5px; flex-wrap:nowrap; overflow-x:auto; flex:1; align-items:center; }
    .gem-btn {
      width:36px; height:36px; border-radius:50%;
      border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:14px; cursor:pointer;
      flex-shrink:0; transition:all 0.15s;
      background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.08), transparent);
      position:relative;
    }
    .gem-btn:hover {
      border-color:var(--gold);
      box-shadow:0 0 10px var(--gold-glow);
      transform:scale(1.1);
    }
    .gem-btn.active {
      border-color:var(--blood-bright);
      box-shadow:0 0 14px rgba(196,43,43,0.5);
      animation:gemBtnGlow 2s ease-in-out infinite;
    }
    .gem-btn .gem-tip {
      display:none; position:absolute; bottom:42px; left:50%; transform:translateX(-50%);
      background:#1a1410; border:1px solid var(--border-gold); border-radius:2px;
      padding:2px 8px; font-size:9px; color:var(--gold);
      font-family:'Cinzel',serif; white-space:nowrap; pointer-events:none; z-index:100;
    }
    .gem-btn:hover .gem-tip { display:block; }

    /* ========== PANEL CONTENT STYLES ========== */
    .section-label {
      font-size:10px; color:var(--text-dim); text-transform:uppercase;
      letter-spacing:2px; margin-bottom:8px; font-family:'Cinzel',serif;
      display:flex; align-items:center; gap:6px;
      text-shadow:0 0 6px rgba(62,51,48,0.5);
    }
    .section-label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border),transparent); }

    .suggestion-card {
      background:linear-gradient(180deg,#1a1712,#161410);
      border:1px solid var(--border); border-radius:2px; padding:10px; margin-bottom:6px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);
      animation:cardFadeIn 0.3s ease-out both;
    }
    .suggestion-prio {
      font-size:8px; font-weight:800; text-transform:uppercase;
      letter-spacing:1px; padding:1px 6px; border-radius:2px;
      font-family:'JetBrains Mono',monospace;
    }
    .suggestion-prio.high { color:var(--danger); background:#d2000018; border:1px solid #d2000030; }
    .suggestion-prio.medium { color:var(--warning); background:gold18; border:1px solid gold30; }
    .suggestion-prio.low { color:var(--info); background:#36649218; border:1px solid #36649230; }

    .issue-card {
      border-radius:2px; padding:8px 10px; margin-bottom:4px;
      display:flex; gap:8px; align-items:flex-start;
      animation:cardFadeIn 0.3s ease-out both;
    }
    .issue-card.critical { background:linear-gradient(135deg,#d2000012,#d2000008); border:1px solid #d2000030; border-left:3px solid var(--danger); }
    .issue-card.warning { background:linear-gradient(135deg,gold12,gold08); border:1px solid gold30; border-left:3px solid var(--warning); }
    .issue-card.info { background:linear-gradient(135deg,#36649212,#36649208); border:1px solid #36649230; border-left:3px solid var(--info); }
    .issue-icon { width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px; }
    .issue-card.critical .issue-icon { background:#d2000025; }
    .issue-card.warning .issue-icon { background:gold25; }
    .issue-card.info .issue-icon { background:#36649225; }

    .market-btn {
      font-size:10px;
      background:linear-gradient(180deg,#3a2f20,#2a1f15,#1a1510);
      color:var(--text-bright); border:1px solid var(--border-gold);
      border-radius:2px; padding:4px 10px; cursor:pointer; font-family:'Crimson Text',serif;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),inset 0 -1px 0 rgba(0,0,0,0.3),0 1px 3px rgba(0,0,0,0.3);
      transition:all 0.15s;
    }
    .market-btn:hover { background:linear-gradient(180deg,#4a3f28,#3a2f20,#2a1f15); box-shadow:0 0 10px var(--gold-glow); }

    /* Item tooltip in right panel */
    .poe-tooltip {
      background:linear-gradient(180deg,#1c1810,#0c0a06);
      border:1px solid var(--border); border-top:1px solid #3d2e1f; border-bottom:1px solid #3d2e1f;
      border-radius:0;
    }
    .poe-tooltip .tt-header {
      text-align:center; padding:6px 12px; border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#2a2418,#201c14);
    }
    .poe-tooltip .tt-body { padding:8px 12px; }
    .mod-item { font-size:11px; color:#8888ff; padding:2px 0; display:flex; align-items:center; gap:6px; }
    .mod-tier { font-size:7px; padding:1px 5px; border-radius:2px; font-weight:700; font-family:'JetBrains Mono',monospace; }

    /* Gem group styles */
    .gem-group-card {
      background:linear-gradient(180deg,#1a1712,#161410);
      border:1px solid var(--border); border-radius:2px; padding:10px; margin-bottom:6px;
      position:relative;
    }
    .gem-group-card::before { content:''; position:absolute;top:-1px;left:-1px;width:8px;height:8px;border-top:2px solid var(--border-gold);border-left:2px solid var(--border-gold);pointer-events:none; }
    .gem-group-card::after { content:''; position:absolute;bottom:-1px;right:-1px;width:8px;height:8px;border-bottom:2px solid var(--border-gold);border-right:2px solid var(--border-gold);pointer-events:none; }

    /* Checklist */
    .check-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid #201c14; font-size:11px; }
    .check-box {
      width:16px;height:16px;border-radius:2px; border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center; font-size:10px; flex-shrink:0;
    }
    .check-box.done { border-color:var(--success); background:#4ae63a15; color:var(--success); box-shadow:0 0 4px rgba(62,196,30,0.2); }

    /* Action buttons */
    .action-btn {
      display:flex; align-items:center; gap:8px;
      padding:8px 10px; background:linear-gradient(180deg,#1a1520,#1c1914,#141210);
      border:1px solid var(--border); border-radius:2px; cursor:pointer;
      text-align:left; width:100%; margin-bottom:4px; transition:all 0.15s;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .action-btn:hover { border-color:var(--border-gold); box-shadow:0 0 8px rgba(139,105,20,0.1); }

    /* Boss readiness */
    .boss-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid #201c14; font-size:11px; }
    .boss-row:last-child { border-bottom:none; }
    .boss-status { font-size:9px; padding:2px 6px; border-radius:2px; font-weight:700; font-family:'JetBrains Mono',monospace; }
    .boss-status.ready { color:var(--success); background:#4ae63a15; }
    .boss-status.risky { color:var(--warning); background:gold15; }
    .boss-status.not-ready { color:var(--danger); background:#d2000015; }

    /* Combat card */
    .combat-card {
      background:linear-gradient(180deg,#1a1712,#161410);
      border:1px solid var(--border); border-radius:2px; padding:10px; margin-bottom:6px;
      position:relative; overflow:hidden;
    }
    .combat-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--fire),transparent); }
    .hp-bar { height:14px; background:linear-gradient(180deg,#1a0a04,#0e0604); border-radius:2px; overflow:hidden; border:1px solid #3a1a0a; position:relative; }
    .hp-bar-fill { height:100%; border-radius:1px; position:relative; }
    .hp-bar-fill.monster { background:linear-gradient(180deg,#dd3333,#cc3333,#882222); box-shadow:0 0 6px rgba(204,51,51,0.3); }
    .hp-bar-fill.dps { background:linear-gradient(180deg,#f09030,var(--unique-bright),#a04010); box-shadow:0 0 6px rgba(232,112,32,0.3); }
    .hp-bar-text { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;font-family:'JetBrains Mono',monospace;white-space:nowrap; }
    .combat-stat { display:flex;justify-content:space-between;padding:4px 6px;background:linear-gradient(180deg,#0e0a08,#0a0806);border-radius:2px;font-size:10px;border:1px solid rgba(42,30,48,0.3); }

    /* Defense badge */
    .defense-badge {
      font-size:9px; padding:2px 8px; border-radius:2px; font-family:'JetBrains Mono',monospace;
      border:1px solid; display:inline-flex; align-items:center; gap:3px;
    }
    .defense-badge.active { color:var(--success); border-color:#4ae63a40; background:#4ae63a10; }
    .defense-badge.missing { color:var(--danger); border-color:#d2000040; background:#d2000010; }

    /* Grimoire input */
    .grimoire-input {
      flex:1; padding:8px 10px; background:linear-gradient(180deg,#141210,#0c0a08);
      border:1px solid var(--border); border-radius:2px; color:var(--text);
      font-family:'Crimson Text',serif; font-size:12px; outline:none;
    }
    .grimoire-input:focus { border-color:var(--blood-bright); box-shadow:0 0 8px rgba(196,43,43,0.15); }
    .invoke-btn {
      padding:8px 14px; background:linear-gradient(180deg,#6a2020,#5a1a1a,#4a1515);
      border:1px solid var(--blood-bright); border-radius:2px; color:var(--blood-bright);
      font-family:'Cinzel',serif; font-size:11px; font-weight:700; cursor:pointer;
      letter-spacing:1px; transition:all 0.15s;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 1px 3px rgba(0,0,0,0.3);
    }
    .invoke-btn:hover { background:linear-gradient(180deg,#7a2828,#6a2020,#5a1a1a); box-shadow:0 0 12px rgba(196,43,43,0.3); }

    .grimoire-q-btn {
      font-size:9px; padding:4px 8px; background:linear-gradient(180deg,#1a1218,#1c1914);
      border:1px solid var(--border); border-radius:2px; color:var(--blood-bright);
      cursor:pointer; font-family:'Crimson Text',serif; transition:all 0.15s;
    }
    .grimoire-q-btn:hover { border-color:var(--blood-bright); box-shadow:0 0 6px rgba(196,43,43,0.15); }

    /* Provider label in settings */
    .provider-option {
      display:flex;align-items:center;gap:8px;padding:6px 8px;
      background:linear-gradient(180deg,#141210,#0c0a08);border:1px solid var(--border);
      border-radius:2px;cursor:pointer;margin-bottom:4px;transition:all 0.15s;
    }
    .provider-option:hover { border-color:var(--border-gold); }
    .provider-option.selected { border-color:#4ae63a40; }

    /* ========== RESPONSIVE < 900px ========== */
    @media (max-width:900px) {
      .sidebar-left {
        width:100%; min-width:unset; flex-direction:row; flex-wrap:wrap;
        border-right:none; border-bottom:1px solid var(--border);
        padding:6px; gap:4px; overflow-y:visible; overflow-x:auto;
        max-height:none; min-height:auto;
      }
      .sidebar-left .stat-row { flex:1; min-width:55px; padding:4px 2px; }
      .sidebar-left .stat-row .s-val { font-size:14px; }
      .sidebar-left .resist-mini { min-width:70px; flex:1; }
      .hud-body { flex-direction:column; }
      .sidebar-right {
        position:fixed; bottom:56px; left:0; right:0;
        width:100%; min-width:unset;
        max-height:60vh; border-left:none; border-top:2px solid var(--border-blood);
        transform:translateY(100%); transition:transform 0.3s ease;
        z-index:50;
      }
      .sidebar-right.open { transform:translateY(0); animation:slideUp 0.3s ease; }
      .center-panel { padding:8px; }
    }
  </style>
</head>
<body>

  <!-- ========== HEADER ========== -->
  <div class="hud-header">
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="hdr-title">PATH<span>of</span>AI</div>
      <div class="hdr-class">Inquisitor <span class="lvl">Lv.95</span></div>
    </div>
    <div class="hdr-sync">
      <div class="sync-dot"></div>
      <span style="font-size:9px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;">SYNCED</span>
      <span class="hdr-val">47.3d</span>
    </div>
  </div>

  <!-- ========== MAIN BODY ========== -->
  <div class="hud-body">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar-left">
      <div class="stat-row life-row">
        <div class="s-icon">&#x2764;</div>
        <div class="s-val" style="color:var(--life);">6,453</div>
        <div class="s-label">Life</div>
      </div>
      <div class="stat-row es-row">
        <div class="s-icon">&#x1F535;</div>
        <div class="s-val" style="color:var(--es);">1,820</div>
        <div class="s-label">ES</div>
      </div>
      <div class="stat-row armour-row">
        <div class="s-icon">&#x1F6E1;</div>
        <div class="s-val" style="color:var(--physical);">28.5K</div>
        <div class="s-label">Armour</div>
      </div>
      <div class="stat-row dps-row">
        <div class="s-icon">&#x2694;</div>
        <div class="s-val" style="color:var(--unique-bright);">2.84M</div>
        <div class="s-label">DPS</div>
      </div>

      <div style="margin-top:2px;font-size:8px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-family:'Cinzel',serif;padding:0 2px;">Resists</div>

      <div class="resist-mini">
        <div class="r-orb fire">&#x1F525;</div>
        <div class="r-info">
          <div class="r-val capped">80%</div>
          <div class="r-oc">+5 oc</div>
        </div>
      </div>
      <div class="resist-mini">
        <div class="r-orb cold">&#x2744;</div>
        <div class="r-info">
          <div class="r-val capped">76%</div>
          <div class="r-oc">+1 oc</div>
        </div>
      </div>
      <div class="resist-mini">
        <div class="r-orb lightning">&#x26A1;</div>
        <div class="r-info">
          <div class="r-val capped">79%</div>
          <div class="r-oc">+4 oc</div>
        </div>
      </div>
      <div class="resist-mini">
        <div class="r-orb chaos">&#x2620;</div>
        <div class="r-info">
          <div class="r-val uncapped">15%</div>
          <div class="r-oc" style="color:var(--danger);">LOW</div>
        </div>
      </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="center-panel">

      <!-- CHARACTER VISUALIZATION -->
      <div id="character-viz" style="position:relative;width:360px;max-width:100%;margin:0 auto;height:380px;overflow:hidden;border-radius:4px;">

        <!-- Dynamic animated background (dark arena / hideout) -->
        <svg class="char-bg" viewBox="0 0 360 380" preserveAspectRatio="xMidYMid slice" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;">
          <defs>
            <radialGradient id="arenaBg" cx="50%" cy="55%" r="55%">
              <stop offset="0%" stop-color="#1a1018"/>
              <stop offset="40%" stop-color="#0e080c"/>
              <stop offset="100%" stop-color="#06040a"/>
            </radialGradient>
            <radialGradient id="floorGlow" cx="50%" cy="90%" r="45%">
              <stop offset="0%" stop-color="#960000" stop-opacity="0.06"/>
              <stop offset="100%" stop-color="#960000" stop-opacity="0"/>
            </radialGradient>
            <!-- Particle pattern -->
            <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
          </defs>
          <!-- Dark arena floor -->
          <rect width="360" height="380" fill="url(#arenaBg)"/>
          <!-- Floor glow from RF -->
          <rect width="360" height="380" fill="url(#floorGlow)">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
          </rect>
          <!-- Stone floor circle -->
          <ellipse cx="180" cy="320" rx="140" ry="30" fill="none" stroke="#3a3028" stroke-width="0.5" opacity="0.4"/>
          <ellipse cx="180" cy="320" rx="100" ry="20" fill="none" stroke="#3a3028" stroke-width="0.3" opacity="0.3"/>
          <!-- Floating embers -->
          <circle cx="60" cy="300" r="1" fill="#960000" opacity="0.4"><animate attributeName="cy" values="300;240;180" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/></circle>
          <circle cx="290" cy="320" r="0.8" fill="#960000" opacity="0.3"><animate attributeName="cy" values="320;250;190" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="8s" repeatCount="indefinite"/></circle>
          <circle cx="150" cy="310" r="1.2" fill="#e8a444" opacity="0.2"><animate attributeName="cy" values="310;230;160" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/></circle>
          <circle cx="220" cy="330" r="0.7" fill="#960000" opacity="0.3"><animate attributeName="cy" values="330;260;200" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.3;0" dur="9s" repeatCount="indefinite"/></circle>
          <circle cx="100" cy="340" r="0.9" fill="#e8a444" opacity="0.2"><animate attributeName="cy" values="340;270;210" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.4;0" dur="5s" repeatCount="indefinite"/></circle>
          <!-- Subtle fog/mist at bottom -->
          <rect x="0" y="340" width="360" height="40" fill="url(#arenaBg)" opacity="0.5"/>
        </svg>

        <!-- Aura rings (rotating around character) -->
        <svg class="aura-layer" viewBox="0 0 360 380" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;">
          <!-- Determination aura (grey/blue outer ring) -->
          <circle cx="180" cy="200" r="155" fill="none" stroke="#7a8090" stroke-width="1.5" stroke-dasharray="12,8" opacity="0.3">
            <animateTransform attributeName="transform" type="rotate" from="0 180 200" to="360 180 200" dur="20s" repeatCount="indefinite"/>
          </circle>
          <!-- Purity of Fire aura (red inner ring) -->
          <circle cx="180" cy="200" r="135" fill="none" stroke="#960000" stroke-width="1" stroke-dasharray="8,12" opacity="0.35">
            <animateTransform attributeName="transform" type="rotate" from="360 180 200" to="0 180 200" dur="15s" repeatCount="indefinite"/>
          </circle>
          <!-- Vitality aura (green pulsing ring) -->
          <circle cx="180" cy="200" r="120" fill="none" stroke="#4ae63a" stroke-width="0.8" stroke-dasharray="4,16" opacity="0.25">
            <animateTransform attributeName="transform" type="rotate" from="0 180 200" to="360 180 200" dur="25s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.15;0.35;0.15" dur="3s" repeatCount="indefinite"/>
          </circle>

      { id:'harbinger',icon:'\u26A0',  label:'Harbinger', color:'var(--warning)' },
      { id:'settings', icon:'\u2699',  label:'Settings', color:'var(--text-muted)' },
    ];

    let activePanel = 'prophecy';
    let activeItemId = null;

    // ==========================================
    // HELPERS
    // ==========================================
    const rarityColors = { UNIQUE:"var(--unique)", RARE:"var(--rare)", MAGIC:"var(--magic)", NORMAL:"var(--normal)" };
    function scoreColor(s) { return s >= 80 ? "var(--success)" : s >= 60 ? "var(--warning)" : s >= 40 ? "var(--unique)" : "var(--danger)"; }
    function fmtDps(n) { return n >= 1e6 ? (n/1e6).toFixed(2)+"M" : n >= 1e3 ? (n/1e3).toFixed(0)+"K" : n; }

    function renderSockets(sockStr) {
      if (!sockStr) return '';
      const colors = { R:'#d20000', G:'#1ea82e', B:'#1e6ec4', W:'#c8c8c8' };
      return sockStr.split('').map((s,i) => {
        const c = colors[s] || colors.W;
        const link = i < sockStr.length - 1 ? '<span style="display:inline-block;width:4px;height:2px;background:'+c+'40;vertical-align:middle;"></span>' : '';
        return '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 30% 30%,'+c+','+c+'80);border:1px solid '+c+'60;box-shadow:0 0 3px '+c+'30;vertical-align:middle;"></span>'+link;
      }).join('');
    }

    // ==========================================
    // RENDER EQUIPMENT GRID
    // ==========================================
    // ==========================================
    // RENDER CHARACTER BODY EQUIPMENT
    // ==========================================
    function renderCharEquip() {
      const slots = document.querySelectorAll('.char-slot[data-slot]');
      const rarityBorders = { UNIQUE:'#af6025', RARE:'#ffff77', MAGIC:'#8888ff', NORMAL:'#c8c8c8' };
      slots.forEach(el => {
        const slotName = el.dataset.slot;
        const item = BUILD.items.find(i => i.slot === slotName);
        if (item) {
          const rc = rarityBorders[item.rarity] || '#c8c8c8';
          const sc = scoreColor(item.score);
          el.style.borderColor = rc + '60';
          el.style.background = `radial-gradient(circle at 40% 40%, ${rc}12, rgba(19,15,24,0.7))`;
          el.innerHTML = `<span style="font-size:${el.classList.contains('char-slot-sm')?'12px':'18px'};">${item.icon}</span>
            <span class="slot-label">${item.name} (${item.score})</span>`;
          el.title = `${item.name} — ${item.base} — Score: ${item.score}`;
        } else {
          el.innerHTML = `<span style="opacity:0.2;font-size:12px;">+</span><span class="slot-label">${slotName}</span>`;
        }
      });
    }

    // (showItemDetail defined below — handles both slot name and item ID)

    function renderEquipGrid() {
      const slotOrder = [
        "Weapon 1","Helmet","Shield",
        "Gloves","Body Armour","Boots",
        "Ring 1","Belt","Ring 2",
        null,"Amulet",null,
      ];
      const slotIcons = {
        "Weapon 1":"\u2694","Helmet":"\u{1FA96}","Shield":"\u{1F6E1}",
        "Gloves":"\u{1F9E4}","Body Armour":"\u{1F6E1}","Boots":"\u{1F462}",
        "Ring 1":"\u{1F48D}","Belt":"\u{1F4BF}","Ring 2":"\u{1F48D}",
        "Amulet":"\u{1F4FF}"
      };
      document.getElementById('equip-grid').innerHTML = slotOrder.map(slotName => {
        if (!slotName) return '<div></div>';
        const item = BUILD.items.find(i => i.slot === slotName);
        if (!item) {
          return `<div class="equip-slot-empty"><div style="font-size:18px;opacity:0.3;">${slotIcons[slotName]||'?'}</div><div style="font-size:7px;color:var(--text-dim);">${slotName}</div></div>`;
        }
        const sc = scoreColor(item.score);
        const rc = rarityColors[item.rarity];
        return `<div class="equip-slot" onclick="showItemDetail(${item.id})" data-item="${item.id}">
          <div class="slot-icon">${item.icon}</div>
          <div class="slot-name" style="color:${rc};">${item.name}</div>
          <div class="slot-label">${item.slot}</div>
          <div class="slot-score" style="color:${sc};">${item.score}</div>
        </div>`;
      }).join('');
    }

    // ==========================================
    // RENDER HARBINGER COMPACT
    // ==========================================
    function renderHarbingerCompact() {
      document.getElementById('harbinger-compact').innerHTML = BUILD.issues.slice(0,3).map((iss, idx) =>
        `<div class="harbinger-compact warning" style="animation-delay:${idx*0.05}s;"><span class="h-icon">\u26A0</span><span class="h-text">${iss.issue}</span></div>`
      ).join('');
    }

    // ==========================================
    // RENDER HUD GEM BUTTONS
    // ==========================================
    function renderGemBtns() {
      document.getElementById('gem-btns').innerHTML = HUD_GEMS.map(g =>
        `<div class="gem-btn ${activePanel===g.id?'active':''}" style="color:${g.color};border-color:${activePanel===g.id?'var(--blood-bright)':g.color+'60'};background:radial-gradient(circle at 35% 35%,${g.color}20,transparent);" onclick="showPanel('${g.id}')" data-gem="${g.id}">
          ${g.icon}
          <span class="gem-tip">${g.label}</span>
        </div>`
      ).join('');
    }

    // ==========================================
    // PANEL SWITCHING
    // ==========================================
    function showPanel(id) {
      activePanel = id;
      activeItemId = null;
      renderGemBtns();
      const el = document.getElementById('rp-title');
      const content = document.getElementById('rp-content');
      // On mobile, open the sidebar
      document.getElementById('sidebar-right').classList.add('open');

      const panelMap = {
        prophecy: { title:'Prophecy', render:renderProphecy },
        grimoire: { title:'Grimoire', render:renderGrimoire },
        stash:    { title:'Stash', render:renderStash },
        combat:   { title:'The Arena', render:renderCombat },
        defenses: { title:'Defenses', render:renderDefenses },
        dps:      { title:'DPS', render:renderDPS },
        gems:     { title:'Gems', render:renderGemsPanel },
        passive:  { title:'Passive Tree', render:renderPassiveTree },
        blood:    { title:'Blood Pact', render:renderBloodPact },
        darkpath: { title:'Dark Path', render:renderDarkPath },
        forge:    { title:'The Forge', render:renderForge },
        cursemap: { title:'Curse Map', render:renderCurseMap },
        harbinger:{ title:'Harbinger', render:renderHarbinger },
        settings: { title:'Settings', render:renderSettings },
      };
      const p = panelMap[id];
      if (p) { el.textContent = p.title; p.render(content); }
    }

    function showDefaultPanel() {
      document.getElementById('sidebar-right').classList.remove('open');
      showPanel('prophecy');
    }

    function showItemDetail(idOrSlot) {
      // Accept both item ID (number) or slot name (string)
      const item = typeof idOrSlot === 'string'
        ? BUILD.items.find(i => i.slot === idOrSlot)
        : BUILD.items.find(i => i.id === idOrSlot);
      if (!item) return;
      activeItemId = item.id;
      activePanel = null;
      renderGemBtns();
      // Highlight character slot
      document.querySelectorAll('.char-slot').forEach(s => s.classList.remove('active'));
      const charSlot = document.querySelector(`.char-slot[data-slot="${item.slot}"]`);
      if (charSlot) charSlot.classList.add('active');
      document.getElementById('rp-title').textContent = item.slot;
      document.getElementById('sidebar-right').classList.add('open');
      const c = document.getElementById('rp-content');
      const rc = rarityColors[item.rarity];
      const sc = scoreColor(item.score);
      const mods = item.mods.map((m,i) => {
        const t = item.tierInfo[i] ? `<span class="mod-tier" style="color:${item.tierInfo[i].color};background:${item.tierInfo[i].color}15;">${item.tierInfo[i].tier}</span>` : '';
        return `<div class="mod-item"><span style="color:var(--text-muted);font-size:7px;">\u25CF</span>${m} ${t}</div>`;
      }).join('');
      const sockets = item.sockets ? `<div style="padding:6px 0;">${renderSockets(item.sockets)}</div>` : '';
      const open = (item.openAffixes.prefixes > 0 || item.openAffixes.suffixes > 0) ?
        `<div style="margin-top:8px;padding:6px 8px;background:#4ae63a08;border:1px solid #4ae63a25;border-radius:2px;font-size:10px;color:var(--success);font-weight:600;">Open: ${item.openAffixes.prefixes > 0 ? item.openAffixes.prefixes+' prefix' : ''}${item.openAffixes.prefixes && item.openAffixes.suffixes ? ', ' : ''}${item.openAffixes.suffixes > 0 ? item.openAffixes.suffixes+' suffix' : ''}<div style="font-size:9px;color:#4ae63a80;margin-top:2px;">Benchcraft available</div></div>` : '';
      const weak = item.weaknesses.map(w => `<div style="margin-top:4px;padding:6px 8px;background:#d2000008;border:1px solid #d2000025;border-radius:2px;font-size:10px;color:var(--danger);display:flex;align-items:center;gap:4px;">\u26A0 ${w.issue}</div>`).join('');

      c.innerHTML = `
        <div class="poe-tooltip" style="margin-bottom:10px;">
          <div class="tt-header">
            <div style="font-size:14px;font-weight:700;color:${rc};">${item.name}</div>
            <div style="font-size:10px;color:var(--text-muted);">${item.base}</div>
          </div>
          <div class="tt-body">
            ${sockets}
            ${mods}
            ${open}
            ${weak}
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11px;color:var(--text-dim);">Score: <strong style="color:${sc};font-family:'JetBrains Mono',monospace;">${item.score}/100</strong></span>
          <span style="font-size:11px;color:var(--gold);font-family:'JetBrains Mono',monospace;">${item.value} divine</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);">
          <span>Rarity: <span style="color:${rc};">${item.rarity}</span></span>
          <span>Slot: ${item.slot}</span>
        </div>
      `;

      // Highlight active slot in grid
      document.querySelectorAll('.equip-slot').forEach(s => s.classList.remove('active'));
      const slotEl = document.querySelector(`.equip-slot[data-item="${itemId}"]`);
      if (slotEl) slotEl.classList.add('active');
    }

    // ==========================================
    // PANEL RENDERERS
    // ==========================================
    function renderProphecy(el) {
      el.innerHTML = '<div class="section-label">\u2721 The Seer Foretells</div>' +
        BUILD.suggestions.map((s, idx) => {
          const mf = s.marketFound;
          const marketHtml = mf ? `<div style="margin-top:6px;padding:6px 8px;background:linear-gradient(135deg,#e8d44d08,#e8d44d04);border:1px solid #e8d44d20;border-radius:2px;">
            <div style="font-size:8px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-family:'Cinzel',serif;margin-bottom:3px;">\uD83D\uDD0D Found on Market</div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div><div style="font-size:11px;font-weight:600;color:var(--rare);">${mf.name}</div><div style="font-size:9px;color:var(--text-muted);">DPS: <span style="color:var(--success);">${mf.dpsGain}</span> \u2022 Life: <span style="color:var(--success);">${mf.lifeGain}</span></div></div>
              <div style="text-align:right;"><div style="font-size:12px;font-weight:800;color:var(--gold);font-family:'JetBrains Mono',monospace;">${mf.price}</div><button class="market-btn" style="margin-top:3px;font-size:8px;padding:2px 8px;">Buy Now \u2192</button></div>
            </div></div>` : (s.marketSearch ? '<div style="margin-top:6px;text-align:center;"><button class="market-btn" style="font-size:9px;">Seek the Market \u2192</button></div>' : '');
          return `<div class="suggestion-card" style="animation-delay:${idx*0.04}s;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;"><span class="suggestion-prio ${s.priority}">${s.priority}</span><span style="font-size:10px;color:var(--text-muted);">${s.slot}</span></div>
            <div style="font-size:12px;color:var(--text-bright);font-weight:600;margin-bottom:3px;">${s.message}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;line-height:1.4;">${s.details.replace(/\n/g,'<br>')}</div>
            <div style="font-size:10px;color:var(--success);font-style:italic;">${s.impact}</div>
            ${marketHtml}
          </div>`;
        }).join('');
    }

    // ==========================================

    // ==========================================
    function renderPassiveMini() {
      const container = document.getElementById('passive-tree-mini');
      if (!container) return;
      // Generate a mini constellation of passive nodes
      // In production this would parse actual tree data from PoB
      const nodes = [];
      const links = [];
      // Simulate a passive tree branch pattern (Templar start area)
      const centerX = 180, centerY = 60;
      // Core cluster around start
      for (let ring = 0; ring < 4; ring++) {
        const count = ring === 0 ? 1 : ring * 6;
        const radius = ring * 22;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + ring * 0.3;
          const x = centerX + Math.cos(angle) * radius + (Math.random() - 0.5) * 8;
          const y = centerY + Math.sin(angle) * radius + (Math.random() - 0.5) * 8;
          const allocated = ring < 3 || Math.random() > 0.3;
          const isKeystone = ring === 3 && Math.random() > 0.7;
          nodes.push({ x, y, allocated, isKeystone, size: isKeystone ? 5 : ring === 0 ? 4 : 3 });
          // Link to previous ring node
          if (ring > 0 && nodes.length > 1) {
            const prevIdx = Math.max(0, nodes.length - count - 1 + Math.floor(i / 2));
            links.push({ from: prevIdx, to: nodes.length - 1, allocated });
          }
        }
      }
      let html = '';
      // Render links
      links.forEach(l => {
        const from = nodes[l.from], to = nodes[l.to];
        if (!from || !to) return;
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        html += `<div class="passive-link" style="left:${from.x}px;top:${from.y}px;width:${len}px;height:1px;transform:rotate(${angle}deg);opacity:${l.allocated?0.4:0.1};background:${l.allocated?'var(--gold)':'#3a3028'};"></div>`;
      });
      // Render nodes
      nodes.forEach(n => {
        const cls = n.isKeystone ? 'passive-node keystone' : n.allocated ? 'passive-node allocated' : 'passive-node unallocated';
        html += `<div class="${cls}" style="left:${n.x - n.size/2}px;top:${n.y - n.size/2}px;width:${n.size}px;height:${n.size}px;"></div>`;
      });
      container.innerHTML = html;
    }

    function triggerPowerUp(message) {
      const viz = document.getElementById('character-viz');
      if (!viz) return;

      // Flash the character body
      const body = viz.querySelector('.char-body');
      if (body) {
        body.classList.add('char-powerup');
        setTimeout(() => body.classList.remove('char-powerup'), 800);
      }

      // Expanding ring effect
      const ring = document.createElement('div');
      ring.className = 'powerup-ring';
      viz.appendChild(ring);
      setTimeout(() => ring.remove(), 800);

      // Floating text
      const text = document.createElement('div');
      text.className = 'powerup-text';
      text.textContent = message || 'POWER UP';
      viz.appendChild(text);
      setTimeout(() => text.remove(), 1500);
    }

      el.innerHTML = '<div class="section-label">\u2620 Harbinger Warnings (' + BUILD.issues.length + ')</div>' +
        BUILD.issues.map((i, idx) =>
          `<div class="issue-card ${i.severity}" style="animation-delay:${idx*0.04}s;"><div class="issue-icon">${icons[i.severity]||icons.info}</div><div><div style="font-size:11px;font-weight:600;color:${i.severity==='warning'?'var(--warning)':i.severity==='critical'?'var(--danger)':'var(--info)'};">${i.issue}</div><div style="font-size:9px;color:var(--text-muted);margin-top:2px;">Remedy: ${i.fix}</div></div></div>`
        ).join('');
    }

    function renderSettings(el) {
      const providers = [
        { key:'seer', icon:'\uD83D\uDC41', name:'The Seer (Local)', desc:'Free \u2022 Offline \u2022 <100ms', tag:'DEFAULT', tagColor:'var(--success)' },
        { key:'claude', icon:'\uD83D\uDCAC', name:'Anthropic (Claude)', desc:'Best reasoning \u2022 API key', tag:'API KEY', tagColor:'var(--chaos)' },
        { key:'openai', icon:'\uD83E\uDD16', name:'OpenAI (ChatGPT)', desc:'GPT-4o \u2022 API key', tag:'API KEY', tagColor:'var(--chaos)' },
        { key:'gemini', icon:'\u2728', name:'Google (Gemini)', desc:'Gemini Pro \u2022 OAuth', tag:'OAUTH', tagColor:'var(--info)' },
        { key:'groq', icon:'\u26A1', name:'Groq', desc:'Very fast \u2022 Free tier', tag:'API KEY', tagColor:'var(--chaos)' },
        { key:'ollama', icon:'\uD83D\uDCBB', name:'Ollama (Local)', desc:'Any model \u2022 Free', tag:'FREE', tagColor:'var(--success)' },
        { key:'openrouter', icon:'\uD83C\uDF10', name:'OpenRouter', desc:'100+ models \u2022 OAuth', tag:'OAUTH', tagColor:'var(--info)' },
      ];
      el.innerHTML = `
        <div class="section-label">\u2699 Settings</div>
        <div style="font-size:10px;color:var(--text-bright);font-weight:700;font-family:'Cinzel',serif;margin-bottom:6px;">\uD83D\uDC41 AI Provider</div>
        ${providers.map(p =>
          `<div class="provider-option" onclick="this.querySelector('input').checked=true;">
            <input type="radio" name="provider" value="${p.key}" ${p.key==='seer'?'checked':''} style="accent-color:var(--blood-bright);flex-shrink:0;">
            <div style="flex:1;"><div style="font-size:10px;color:var(--text-bright);font-weight:600;">${p.icon} ${p.name}</div><div style="font-size:8px;color:var(--text-muted);">${p.desc}</div></div>
            <span style="font-size:7px;color:${p.tagColor};font-family:'JetBrains Mono',monospace;">${p.tag}</span>
          </div>`
        ).join('')}

        <div style="margin-top:10px;background:linear-gradient(180deg,#1a1712,#161410);border:1px solid var(--border);border-radius:2px;padding:8px;">
          <div style="font-size:10px;color:var(--text-bright);font-weight:700;font-family:'Cinzel',serif;margin-bottom:6px;">\uD83D\uDD11 API Key</div>
          <div style="display:flex;gap:6px;margin-bottom:6px;">
            <input type="password" placeholder="sk-ant-..." style="flex:1;padding:6px 8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:2px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:9px;outline:none;">
            <button class="market-btn" style="font-size:9px;">Test</button>
          </div>
        </div>

        <div style="margin-top:8px;background:linear-gradient(180deg,#1a1712,#161410);border:1px solid var(--border);border-radius:2px;padding:8px;">
          <div style="font-size:10px;color:var(--text-bright);font-weight:700;font-family:'Cinzel',serif;margin-bottom:6px;">\uD83C\uDFAE PoE Account</div>
          <button style="width:100%;padding:8px;background:linear-gradient(180deg,#2a1808,#1a1004);border:1px solid var(--unique);border-radius:2px;color:var(--unique-bright);font-family:'Cinzel',serif;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:1px;">\uD83D\uDD17 Connect PoE Account</button>
          <div style="font-size:8px;color:var(--text-dim);margin-top:4px;">\uD83D\uDD12 Official GGG OAuth \u2022 We never see your password</div>
        </div>

        <div style="margin-top:8px;background:linear-gradient(180deg,#1a1712,#161410);border:1px solid var(--border);border-radius:2px;padding:8px;">
          <div style="font-size:10px;color:var(--text-bright);font-weight:700;font-family:'Cinzel',serif;margin-bottom:6px;">\uD83D\uDCC1 PoB Location</div>
          <input type="text" value="%AppData%/Path of Building/" readonly style="width:100%;padding:6px 8px;background:var(--bg-dark);border:1px solid var(--border);border-radius:2px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:9px;">
          <div style="font-size:8px;color:var(--success);margin-top:4px;">\u2713 Auto-detected \u2022 12 builds found</div>
        </div>

        <div style="margin-top:8px;background:linear-gradient(180deg,#1a1712,#161410);border:1px solid var(--border);border-radius:2px;padding:8px;">
          <div style="font-size:10px;color:var(--text-bright);font-weight:700;font-family:'Cinzel',serif;margin-bottom:6px;">\u2620 Whisper to the Void</div>
          <button style="width:100%;padding:6px;background:linear-gradient(180deg,#181614,#141210);border:1px solid var(--border);border-radius:2px;color:var(--text-muted);font-family:'Cinzel',serif;font-size:10px;cursor:pointer;">Report Bug / Feedback \u2192</button>
        </div>

        <div style="text-align:center;font-size:8px;color:var(--text-dim);margin-top:10px;">PATH of AI v0.1.0 \u2022 Open Source</div>`;
    }

    function askSeer(btn) {
      const q = btn.textContent;
      const chat = document.getElementById('seer-chat');
      if (!chat) return;
      // Show user question
      chat.innerHTML += `<div style="text-align:right;margin:8px 0;"><span style="background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--text);">${q}</span></div>`;
      // Show typing indicator
      chat.innerHTML += `<div id="seer-typing" style="font-size:10px;color:var(--chaos);font-style:italic;margin:6px 0;">The Seer peers into the void...</div>`;
      chat.scrollTop = chat.scrollHeight;
      // Simulate response after delay
      setTimeout(() => {
        const typing = document.getElementById('seer-typing');
        if (typing) typing.remove();
        const responses = {
          'Why do I perish in T16?': 'Your chaos resistance of 15% leaves you practically naked against corruption, Exile. Al-Hezmin\'s poison ground and chaos-damage rares feast upon this weakness. Furthermore, your overcap of merely +1 cold resist means a single Elemental Weakness curse strips your defenses bare.',
          'What should I upgrade next?': 'Ring 2 is the weakest link in your arsenal, Exile. At score 42, it is barely worthy of a white mob drop. Seek an Opal Ring with +80 life, fire DoT multiplier, and resistances. Cost: 3-8 divine. Impact: +15% DPS, +400 life.',
          'Can I run Uber bosses?': 'Not yet, Exile. Uber Shaper\'s slam deals 12,400 damage \u2014 your 6,453 life plus Molten Shell absorbs only 10,653. You need Aegis Aurora for ES-on-block recovery, or push your max fire resistance higher to reduce RF degen and free up regen.',
          'Explain my DPS chain': 'Your Righteous Fire burns at base 1,245 DPS. This is scaled by: 420% increased fire damage (\u00d75.2), then MULTIPLIED by each support: Burning Damage \u00d71.59, Elemental Focus \u00d71.34, Swift Affliction \u00d71.29, Efficacy \u00d71.24, Lifetap \u00d71.20. Finally, your 180% DoT multiplier gives \u00d72.80. Total: 2.84M.',
        };
        const answer = responses[q] || 'The void whispers an answer I cannot yet discern, Exile. In the Tauri app, The Seer Engine will divine a proper response.';
        chat.innerHTML += `<div style="margin:8px 0;padding:8px 10px;background:linear-gradient(135deg,#d0209008,#d0209004);border:1px solid #d0209020;border-radius:4px;font-size:11px;color:var(--text);line-height:1.6;font-style:italic;">\u{1F441} ${answer}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 1200);
    }

    // ==========================================
    // INIT
    // ==========================================
    renderCharEquip();
    renderEquipGrid();
    renderPassiveMini();
    renderHarbingerCompact();
    renderGemBtns();
    showPanel('prophecy');
  </script>
</body>
</html>
