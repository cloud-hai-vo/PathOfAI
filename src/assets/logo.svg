<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0c0b0a"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d44040"/>
      <stop offset="50%" stop-color="#8b1a1a"/>
      <stop offset="100%" stop-color="#3a0808"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e1510"/>
      <stop offset="100%" stop-color="#080606"/>
    </radialGradient>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#c42b2b" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#c4a830" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="eyeClip">
      <ellipse cx="256" cy="200" rx="134" ry="80"/>
    </clipPath>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d060"/>
      <stop offset="50%" stop-color="#c4a830"/>
      <stop offset="100%" stop-color="#8a6e18"/>
    </linearGradient>
    <linearGradient id="textRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e84444"/>
      <stop offset="40%" stop-color="#c42b2b"/>
      <stop offset="100%" stop-color="#7a1515"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="32"/>

  <!-- Outer ring double border -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="#c4a830" stroke-width="1" opacity="0.25"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="#c4a830" stroke-width="0.5" opacity="0.15"/>

  <!-- Cardinal tick marks on ring -->
  <line x1="256" y1="12" x2="256" y2="30" stroke="#c4a830" stroke-width="2" opacity="0.6"/>
  <line x1="248" y1="20" x2="264" y2="20" stroke="#c4a830" stroke-width="1" opacity="0.4"/>
  <line x1="256" y1="482" x2="256" y2="500" stroke="#c4a830" stroke-width="2" opacity="0.6"/>
  <line x1="248" y1="492" x2="264" y2="492" stroke="#c4a830" stroke-width="1" opacity="0.4"/>
  <line x1="12" y1="256" x2="30" y2="256" stroke="#c4a830" stroke-width="2" opacity="0.6"/>
  <line x1="482" y1="256" x2="500" y2="256" stroke="#c4a830" stroke-width="2" opacity="0.6"/>

  <!-- Corner bracket ornaments -->
  <path d="M 36 36 L 70 36 M 36 36 L 36 70" fill="none" stroke="#c4a830" stroke-width="1.5" opacity="0.45"/>
  <path d="M 476 36 L 442 36 M 476 36 L 476 70" fill="none" stroke="#c4a830" stroke-width="1.5" opacity="0.45"/>
  <path d="M 36 476 L 70 476 M 36 476 L 36 442" fill="none" stroke="#c4a830" stroke-width="1.5" opacity="0.45"/>
  <path d="M 476 476 L 442 476 M 476 476 L 476 442" fill="none" stroke="#c4a830" stroke-width="1.5" opacity="0.45"/>

  <!-- ── THE EYE ── -->

  <!-- Eye ambient glow -->
  <ellipse cx="256" cy="200" rx="140" ry="88" fill="#8b1a1a" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Eye border glow -->
  <ellipse cx="256" cy="200" rx="136" ry="82" fill="none" stroke="#c4a830" stroke-width="4" opacity="0.25"/>

  <!-- Eye white (dark, like PoE) -->
  <ellipse cx="256" cy="200" rx="134" ry="80" fill="#100c06" stroke="#c4a830" stroke-width="1.5"/>

  <!-- Iris -->
  <ellipse cx="256" cy="200" rx="72" ry="72" fill="url(#irisGrad)" clip-path="url(#eyeClip)"/>

  <!-- Iris ring details -->
  <ellipse cx="256" cy="200" rx="72" ry="72" fill="none" stroke="#c42b2b" stroke-width="1" opacity="0.5" clip-path="url(#eyeClip)"/>
  <ellipse cx="256" cy="200" rx="60" ry="60" fill="none" stroke="#8b1a1a" stroke-width="0.7" opacity="0.4" clip-path="url(#eyeClip)"/>
  <ellipse cx="256" cy="200" rx="46" ry="46" fill="none" stroke="#c42b2b" stroke-width="0.5" opacity="0.3" clip-path="url(#eyeClip)"/>

  <!-- Slit pupil (vertical, like a serpent — the AI "sees all") -->
  <ellipse cx="256" cy="200" rx="14" ry="68" fill="url(#pupilGrad)" clip-path="url(#eyeClip)"/>
  <ellipse cx="256" cy="200" rx="10" ry="64" fill="#060404" clip-path="url(#eyeClip)"/>

  <!-- Circuit traces down the pupil slit — the "AI" mark -->
  <line x1="256" y1="136" x2="256" y2="264" stroke="#c4a830" stroke-width="1.2" opacity="0.7"/>
  <!-- Horizontal tick marks at measured intervals -->
  <line x1="250" y1="156" x2="262" y2="156" stroke="#c4a830" stroke-width="0.8" opacity="0.6"/>
  <line x1="248" y1="178" x2="264" y2="178" stroke="#c4a830" stroke-width="0.8" opacity="0.6"/>
  <line x1="248" y1="200" x2="264" y2="200" stroke="#c4a830" stroke-width="1"   opacity="0.8"/>
  <line x1="248" y1="222" x2="264" y2="222" stroke="#c4a830" stroke-width="0.8" opacity="0.6"/>
  <line x1="250" y1="244" x2="262" y2="244" stroke="#c4a830" stroke-width="0.8" opacity="0.6"/>
  <!-- Side branches at center (node dots) -->
  <circle cx="248" cy="200" r="2" fill="#c4a830" opacity="0.8"/>
  <circle cx="264" cy="200" r="2" fill="#c4a830" opacity="0.8"/>
  <line x1="244" y1="200" x2="236" y2="200" stroke="#c4a830" stroke-width="0.8" opacity="0.5"/>
  <line x1="268" y1="200" x2="276" y2="200" stroke="#c4a830" stroke-width="0.8" opacity="0.5"/>
  <circle cx="234" cy="200" r="1.5" fill="#c4a830" opacity="0.5"/>
  <circle cx="278" cy="200" r="1.5" fill="#c4a830" opacity="0.5"/>

  <!-- Eye highlight (specular) -->
  <ellipse cx="226" cy="180" rx="14" ry="8" fill="white" opacity="0.08"/>
  <ellipse cx="222" cy="178" rx="5" ry="3" fill="white" opacity="0.10"/>

  <!-- Eye corner points / wingtips -->
  <path d="M 122 200 L 90 186 L 104 200 L 90 214 Z" fill="#c4a830" opacity="0.7" filter="url(#goldGlow)"/>
  <path d="M 390 200 L 422 186 L 408 200 L 422 214 Z" fill="#c4a830" opacity="0.7" filter="url(#goldGlow)"/>

  <!-- Trailing lines from wingtips -->
  <line x1="104" y1="200" x2="60" y2="200" stroke="#c4a830" stroke-width="0.8" opacity="0.2"/>
  <line x1="408" y1="200" x2="452" y2="200" stroke="#c4a830" stroke-width="0.8" opacity="0.2"/>

  <!-- Eyebrow arc ornaments -->
  <path d="M 150 138 Q 256 102 362 138" fill="none" stroke="#c4a830" stroke-width="1" opacity="0.3"/>
  <path d="M 162 134 Q 256 100 350 134" fill="none" stroke="#c4a830" stroke-width="0.5" opacity="0.2"/>

  <!-- ── DIVIDER ── -->
  <line x1="110" y1="308" x2="402" y2="308" stroke="#c4a830" stroke-width="0.8" opacity="0.4"/>
  <!-- Divider ornament -->
  <polygon points="256,302 262,308 256,314 250,308" fill="#c4a830" opacity="0.5"/>

  <!-- ── TEXT ── -->

  <!-- "PATH OF" label -->
  <text
    x="256" y="355"
    font-family="Cinzel, 'Times New Roman', serif"
    font-size="30"
    font-weight="400"
    fill="url(#textGold)"
    text-anchor="middle"
    letter-spacing="12">PATH OF</text>

  <!-- "AI" — large, blood red, glowing -->
  <text
    x="256" y="430"
    font-family="Cinzel, 'Times New Roman', serif"
    font-size="86"
    font-weight="700"
    fill="url(#textRed)"
    text-anchor="middle"
    letter-spacing="20"
    filter="url(#redGlow)">AI</text>

  <!-- Bottom ornament -->
  <line x1="160" y1="450" x2="352" y2="450" stroke="#c4a830" stroke-width="0.8" opacity="0.3"/>
  <line x1="180" y1="454" x2="332" y2="454" stroke="#c4a830" stroke-width="0.4" opacity="0.2"/>
</svg>
