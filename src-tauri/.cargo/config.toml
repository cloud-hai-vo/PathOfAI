# Cargo config for Path of AI
# Uses MSVC toolchain (x86_64-pc-windows-msvc) with VS 2022 Build Tools.
# Build Tools are at:
#   C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
# Windows SDK 10.0.22621 is at:
#   C:\Program Files (x86)\Windows Kits\10\

[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"
rustflags = [
  "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64",
  "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.22621.0\\um\\x64",
  "-C", "link-arg=/LIBPATH:C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.22621.0\\ucrt\\x64",
]

[env]
# cc-rs uses these env vars to locate cl.exe and headers
# Point to Build Tools, not the VS Enterprise install (which has no headers)
VCINSTALLDIR = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\"
VCToolsInstallDir = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\"
WindowsSdkDir = "C:\\Program Files (x86)\\Windows Kits\\10\\"
WindowsSDKVersion = "10.0.22621.0\\"
# Explicit INCLUDE path so cl.exe can find headers
INCLUDE = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\include;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.22621.0\\ucrt;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.22621.0\\um;C:\\Program Files (x86)\\Windows Kits\\10\\Include\\10.0.22621.0\\shared"
LIB = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\lib\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.22621.0\\um\\x64;C:\\Program Files (x86)\\Windows Kits\\10\\Lib\\10.0.22621.0\\ucrt\\x64"
