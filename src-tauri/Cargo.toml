[package]
name = "path-of-ai"
version = "0.1.0"
description = "Path of Exile build advisor — powered by AI"
authors = ["Path of AI Contributors"]
license = "MIT"
repository = "https://github.com/path-of-ai/path-of-ai"
edition = "2021"

[lib]
name = "path_of_ai_lib"
crate-type = ["rlib"]  # desktop-only; add cdylib+staticlib for mobile

[[bin]]
name = "path-of-ai"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML parsing (for PoB files)
quick-xml = { version = "0.36", features = ["serialize"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (poe.ninja, GGG API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Error handling
thiserror = "1"
anyhow = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled", "bundled-windows"] }

# Cryptography (token storage)
aes-gcm = "0.10"
base64 = "0.22"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# File watching (PoB auto-reload)
notify = "6"

# Logging
log = "0.4"
env_logger = "0.11"

# SHA256 for OAuth PKCE
sha2 = "0.10"

# Random (OAuth state)
rand = "0.8"
hex = "0.4"
urlencoding = "2"
regex = "1"
open = "5"
phf = { version = "0.11", features = ["macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
pob_verify = []  # optional Lua verification via mlua — off by default

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.test]
opt-level = 0
debug = true
